<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruff Family Feud</title>
<meta name="theme-color" content="#1d1440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d1440;--bg2:#2a1d5c;--panel:#33246e;--line:rgba(255,255,255,.14);--ink:#fff;--muted:#c9c0ea;--faint:#9a8fc4;
  --gold:#f5c542;--gold-d:#c99a1a;--blue:#1f4fb8;--blue2:#2c6bed;--red:#e53935;--green:#2fbf71;
  --mac:#f2b33d;--rice:#3fb37f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#1d1440}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at top,#3a2580 0%,var(--bg) 60%) fixed;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:#1d1440}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.title{font-family:Anton,Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);text-shadow:0 3px 0 #7a5400,0 6px 18px rgba(0,0,0,.4);margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.card{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid var(--line);font-size:16px;text-decoration:none;color:#fff}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.btn.blue{background:var(--blue2);border-color:var(--blue2)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.green{background:var(--green);border-color:var(--green);color:#06280f}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.4}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:14px;color:var(--muted)}
.field input,.field textarea,.field select{padding:12px 14px;border-radius:12px;border:0;font-size:16px;background:#fff}
.field textarea{min-height:110px;resize:vertical;font-size:15px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.err{color:#ff8a80;font-size:14px;min-height:1.2em;margin-top:6px}
.pill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.pill.warn{background:rgba(229,57,53,.25);color:#ffb4ae}
.pill.ok{background:rgba(47,191,113,.22);color:#a6f0c6}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:#fff;color:#1d1440;padding:11px 18px;border-radius:999px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* home */
.home-grid{display:grid;gap:12px;margin-top:22px}
.home-grid .btn{padding:18px;font-size:18px;justify-content:flex-start}

/* survey */
.progress{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.q-prompt{font-size:24px;font-weight:700;line-height:1.3;margin:6px 0 4px}
.vote-opt{display:block;width:100%;text-align:left;padding:16px 18px;margin:10px 0;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.08);font-size:18px;font-weight:600}
.vote-opt.on{border-color:var(--gold);background:rgba(245,197,66,.18)}

/* admin */
details.acc{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:center;font-weight:600}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'›';margin-left:auto;color:var(--faint);font-size:20px;transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(90deg)}
.acc-body{padding:4px 16px 16px;border-top:1px solid var(--line)}
.group-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.group-row>div:first-child{flex:1 1 100%}
.group-row:last-child{border-bottom:0}
.group-row select{max-width:150px;padding:6px 8px;border-radius:8px;border:0;font-size:13px}
.group-row .raw{font-size:12px;color:var(--faint)}
.board-preview{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.board-preview div{background:var(--blue);border-radius:8px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.sec-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:22px 0 4px}

/* player phone */
.ph-top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--line)}
.ph-team{font-weight:700}
.ph-main{padding:18px 16px 40px;max-width:520px;margin:0 auto}
.big-msg{text-align:center;font-size:22px;font-weight:600;margin:40px 0 10px;line-height:1.35}
.buzzer{display:block;margin:30px auto;width:min(70vw,300px);height:min(70vw,300px);border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff7a6e,var(--red) 55%,#9e1b17);box-shadow:0 14px 0 #6d0f0c,0 24px 40px rgba(0,0,0,.45);font-family:Anton,Impact,sans-serif;font-size:56px;letter-spacing:.06em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.buzzer:active{transform:translateY(10px);box-shadow:0 4px 0 #6d0f0c,0 10px 20px rgba(0,0,0,.4)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:14px 12px;border-radius:14px;border:0;background:#fff;color:#1d1440;font-weight:600;font-size:15px;line-height:1.25;min-height:60px}
.opt b{flex:none;width:30px;height:30px;border-radius:8px;background:var(--blue2);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Anton,Impact,sans-serif;font-size:17px}
.opt:disabled{opacity:.3;text-decoration:line-through}
.timer{font-family:Anton,Impact,sans-serif;font-size:44px;color:var(--gold);text-align:center}
.team-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.team-pick button{padding:18px 10px;border-radius:16px;border:3px solid transparent;font-weight:700;font-size:17px;background:rgba(255,255,255,.1)}
.team-pick button.on{border-color:var(--gold);background:rgba(245,197,66,.16)}
.team-pick .em{display:block;font-size:40px;margin-bottom:6px}

/* host */
.host-status{font-size:18px;font-weight:600;line-height:1.35}
.host-board{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.hb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--blue);border:0;text-align:left;font-size:15px;color:#fff}
.hb.rev{background:#16357d;opacity:.6}
.hb .n{font-family:Anton,Impact,sans-serif;width:24px;color:var(--gold)}
.hb .pts{margin-left:auto;font-family:Anton,Impact,sans-serif;color:var(--gold)}
.player-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.player-row:last-child{border-bottom:0}

/* TV */
.tv{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;padding:2.2vw 3vw;gap:1.4vw;background:radial-gradient(ellipse at 50% 20%,#4a2fa0 0%,#1d1440 62%,#120c2c 100%)}
.tv-gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vw;background:var(--bg);z-index:5;text-align:center}
.tv-gate .title{font-size:7vw}
.tv-gate button{font-size:2.4vw;padding:1.4vw 3vw;border-radius:1.2vw}
.tv-head{display:flex;align-items:center;gap:2vw}
.tv-head .title{font-size:3.4vw}
.tv-round{font-family:Anton,Impact,sans-serif;font-size:2vw;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tv-prompt{font-size:2.9vw;font-weight:700;text-align:center;line-height:1.25;padding:0 4vw}
.tv-mid{flex:1;display:grid;grid-template-columns:15vw 1fr 15vw;gap:2vw;align-items:center;min-height:0}
.score{text-align:center;border-radius:1.4vw;padding:1.4vw .8vw;background:rgba(0,0,0,.25);border:.3vw solid transparent;transition:all .3s}
.score.ctrl{border-color:var(--gold);box-shadow:0 0 3vw rgba(245,197,66,.35)}
.score .em{font-size:4vw}
.score .nm{font-size:1.5vw;font-weight:700;margin:.4vw 0}
.score .pts{font-family:Anton,Impact,sans-serif;font-size:5vw;color:var(--gold)}
.board{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1vw;padding:1.4vw;border-radius:2vw;background:linear-gradient(#0f2a6e,#0a1d4f);border:.5vw solid var(--gold);box-shadow:0 0 0 .4vw #7a5400,0 2vw 5vw rgba(0,0,0,.5);height:100%;max-height:34vw}
.slot{perspective:80vw}
.slot-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.slot.rev .slot-in{transform:rotateX(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:.8vw;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:linear-gradient(#2c6bed,#1a49b5);border:.25vw solid #6f9cff}
.face.front span{font-family:Anton,Impact,sans-serif;font-size:3vw;color:#fff;width:5vw;height:5vw;border-radius:50%;background:#0c2a78;display:flex;align-items:center;justify-content:center;border:.25vw solid #6f9cff}
.face.back{transform:rotateX(180deg);background:linear-gradient(#1e5ad6,#123e9e);border:.25vw solid #6f9cff;justify-content:space-between;padding:0 1.4vw;gap:1vw}
.face.back .t{font-size:2.1vw;font-weight:700;text-transform:uppercase;line-height:1.1;text-align:left}
.face.back .p{font-family:Anton,Impact,sans-serif;font-size:2.8vw;background:#0c2a78;padding:.2vw 1vw;border-radius:.5vw;color:var(--gold)}
.slot.missed .face.back{background:linear-gradient(#3a3f5e,#2a2e48);border-color:#6a6f92}
.slot.empty{visibility:hidden}
.tv-foot{display:flex;align-items:center;justify-content:center;gap:2vw;min-height:6vw}
.status{font-size:2.4vw;font-weight:700;text-align:center;padding:1vw 2.4vw;border-radius:99vw;background:rgba(0,0,0,.3)}
.bank{font-family:Anton,Impact,sans-serif;font-size:2.4vw;color:var(--gold);padding:.6vw 1.6vw;border-radius:1vw;background:rgba(0,0,0,.3)}
.strikes{display:flex;gap:1vw}
.strikes i{font-style:normal;font-family:Anton,Impact,sans-serif;color:var(--red);font-size:3.4vw;line-height:1;text-shadow:0 .3vw 0 #6d0f0c}
.bigx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:3vw;pointer-events:none;z-index:10}
.bigx i{font-style:normal;font-family:Anton,Impact,sans-serif;font-size:22vw;line-height:1;color:var(--red);text-shadow:0 1vw 0 #6d0f0c,0 0 6vw rgba(229,57,53,.8);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lobby{flex:1;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:3vw;align-items:start;margin-top:1vw}
.join-box{background:#fff;color:#1d1440;border-radius:2vw;padding:2vw;text-align:center}
.join-box .qr{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.join-box .qr svg,.join-box .qr img{width:100%;height:100%}
.join-box .url{font-size:1.6vw;font-weight:700;margin-top:1vw;word-break:break-all}
.join-box .hint{font-size:1.3vw;color:#5a4f86;margin-top:.4vw}
.team-col{background:rgba(0,0,0,.25);border-radius:2vw;padding:2vw;min-height:20vw}
.team-col h3{margin:0 0 1vw;font-size:2.2vw}
.team-col .em{font-size:4vw}
.team-col .p{font-size:1.9vw;font-weight:600;padding:.6vw 0;border-bottom:.1vw solid var(--line)}
.reveal-big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.5vw}
.reveal-big .k{font-size:3vw;color:var(--muted)}
.reveal-big .v{font-family:Anton,Impact,sans-serif;font-size:11vw;color:var(--gold);text-shadow:0 .6vw 0 #7a5400,0 0 6vw rgba(245,197,66,.5);line-height:1;animation:pop .5s ease-out}
.fm{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2vw;min-height:0}
.fm-col{background:linear-gradient(#0f2a6e,#0a1d4f);border:.4vw solid var(--gold);border-radius:1.6vw;padding:1.4vw;display:flex;flex-direction:column;gap:.8vw}
.fm-col h3{margin:0;font-size:2vw;text-align:center}
.fm-row{display:flex;align-items:center;gap:1vw;background:#1a49b5;border-radius:.8vw;padding:.8vw 1.2vw;font-size:1.8vw;font-weight:700;min-height:4.6vw}
.fm-row .t{flex:1;text-transform:uppercase}
.fm-row .p{font-family:Anton,Impact,sans-serif;color:var(--gold);font-size:2.4vw}
.fm-total{text-align:center;font-family:Anton,Impact,sans-serif;font-size:3vw;color:var(--gold);margin-top:auto}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>document.write('<script src="app.js?v='+Date.now()+'"><\/script>')</script>
</body>
</html>
